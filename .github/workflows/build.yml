name: Build MyPhone APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak proyek dari zip (jika ada)
        run: |
          if [ -f myphone-src.zip ]; then unzip -q -o myphone-src.zip -d _src; cp -r _src/MyPhone/. .; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MyPhone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
